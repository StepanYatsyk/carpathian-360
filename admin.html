<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмінка MP4 Плейлиста</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #333; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { margin-bottom: 15px; font-size: 20px; color: #111; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
    input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }
    .btn-save { background: #28a745; margin-top: 15px; }
    .btn-save:hover { background: #218838; }
    .list-item { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .list-item-info { width: 80%; word-break: break-all; }
    .list-item-title { font-weight: bold; font-size: 15px; margin-bottom: 3px; }
    .list-item-url { font-size: 12px; color: #6c757d; }
    .btn-del { background: #dc3545; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; width: auto; }
    .btn-del:hover { background: #c82333; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; }
    hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
  </style>
</head>
<body>

<div class="container">
  <h2>⚙️ Налаштування доступу</h2>
  <label for="token">GitHub Token:</label>
  <input type="password" id="token" placeholder="ghp_..." onchange="saveToken()">

  <hr>

  <h2>➕ Додати фільм (MP4)</h2>
  <label for="title">Назва фільму / відео:</label>
  <input type="text" id="title" placeholder="Наприклад: Орел і Решка">

  <label for="url">Пряме MP4 посилання:</label>
  <input type="text" id="url" placeholder="https://site.com/video.mp4">

  <button onclick="addItem()">Додати до списку</button>

  <hr>

  <h2>📜 Поточний список:</h2>
  <div id="playlistContainer"></div>

  <button class="btn-save" onclick="saveToGitHub()">💾 Зберегти зміни на TV</button>
  <div id="status"></div>
</div>

<script>
  var GITHUB_USER = 'stepanyatsyk';
  var GITHUB_REPO = 'carpathian-360';
  var FILE_PATH = 'playlist.json';

  var playlist = [];
  var fileSha = '';

  window.onload = function() {
    var savedToken = localStorage.getItem('gh_token');
    if (savedToken) document.getElementById('token').value = savedToken;
    loadCurrentPlaylist();
  };

  function saveToken() {
    var token = document.getElementById('token').value.trim();
    localStorage.setItem('gh_token', token);
  }

  function loadCurrentPlaylist() {
    var url = 'https://api.github.com/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/' + FILE_PATH;
    fetch(url)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        fileSha = data.sha;
        var content = decodeURIComponent(escape(atob(data.content)));
        playlist = JSON.parse(content);
        renderList();
      })
      .catch(function(err) {
        document.getElementById('status').innerText = 'Помилка завантаження файлу JSON';
      });
  }

  function renderList() {
    var container = document.getElementById('playlistContainer');
    container.innerHTML = '';
    playlist.forEach(function(item, index) {
      var div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = 
        '<div class="list-item-info">' +
          '<div class="list-item-title">' + item.title + '</div>' +
          '<div class="list-item-url">' + item.url + '</div>' +
        '</div>' +
        '<button class="btn-del" onclick="deleteItem(' + index + ')">❌</button>';
      container.appendChild(div);
    });
  }

  function addItem() {
    var title = document.getElementById('title').value.trim();
    var url = document.getElementById('url').value.trim();

    if (!title || !url) {
      alert('Будь ласка, заповніть назву та посилання!');
      return;
    }

    playlist.push({ title: title, url: url, type: 'mp4' });
    renderList();

    document.getElementById('title').value = '';
    document.getElementById('url').value = '';
  }

  function deleteItem(index) {
    playlist.splice(index, 1);
    renderList();
  }

  function saveToGitHub() {
    var token = localStorage.getItem('gh_token');
    if (!token) {
      alert('Введіть GitHub Token!');
      return;
    }

    var statusEl = document.getElementById('status');
    statusEl.style.color = '#007bff';
    statusEl.innerText = 'Збереження...';

    var updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(playlist, null, 2))));
    var apiUrl = 'https://api.github.com/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/' + FILE_PATH;

    fetch(apiUrl, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: 'Update MP4 playlist',
        content: updatedContent,
        sha: fileSha
      })
    })
    .then(function(res) {
      if (res.ok) {
        return res.json();
      } else {
        throw new Error('Помилка при збереженні');
      }
    })
    .then(function(data) {
      fileSha = data.content.sha;
      statusEl.style.color = '#28a745';
      statusEl.innerText = '✅ Успішно збережено! Зачекайте 1 хвилину для оновлення TV.';
    })
    .catch(function(err) {
      statusEl.style.color = '#dc3545';
      statusEl.innerText = '❌ Помилка збереження. Перевірте Token!';
    });
  }
</script>

</body>
</html>
