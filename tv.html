<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #000; color: #fff; display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 320px; background: #111; border-right: 1px solid #333; display: flex; flex-direction: column; }
    #sidebar h2 { padding: 15px; font-size: 18px; background: #222; border-bottom: 1px solid #333; }
    #playlist { list-style: none; overflow-y: auto; flex: 1; }
    #playlist li { padding: 12px 15px; border-bottom: 1px solid #222; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    #playlist li:hover, #playlist li.active { background: #007bff; color: #fff; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #444; font-weight: bold; text-transform: uppercase; }
    #player-container { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
    video { width: 100%; height: 100%; max-height: 100vh; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>📺 Плейлист TV</h2>
    <ul id="playlist"></ul>
  </div>

  <div id="player-container">
    <video id="videoPlayer" controls autoplay></video>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    const playlistEl = document.getElementById('playlist');
    let hls = null;

    async function loadPlaylist() {
      try {
        // Додаємо timestamp, щоб уникнути кешування браузером
        const res = await fetch('playlist.json?t=' + Date.now());
        const data = await res.json();
        
        playlistEl.innerHTML = '';
        data.forEach((item, index) => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${item.title}</span> <span class="badge">${item.type}</span>`;
          li.onclick = () => playVideo(item.url, item.type, li);
          playlistEl.appendChild(li);

          // Запустити перший елемент за замовчуванням
          if (index === 0) playVideo(item.url, item.type, li);
        });
      } catch (err) {
        console.error('Помилка завантаження плейлиста:', err);
      }
    }

    function playVideo(url, type, element) {
      document.querySelectorAll('#playlist li').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (type === 'm3u8' && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else {
        video.src = url;
        video.play();
      }
    }

    loadPlaylist();
  </script>
</body>
</html>
