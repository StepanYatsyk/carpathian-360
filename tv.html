<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
  <style>
    * { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #000; color: #fff; display: block; height: 100vh; overflow: hidden; }
    #sidebar { width: 30%; height: 100vh; float: left; background: #111; border-right: 1px solid #333; overflow-y: auto; }
    #sidebar h2 { padding: 10px; font-size: 16px; background: #222; border-bottom: 1px solid #333; }
    #playlist { list-style: none; }
    #playlist li { padding: 12px 10px; border-bottom: 1px solid #222; cursor: pointer; font-size: 14px; }
    #playlist li.active { background: #007bff; color: #fff; font-weight: bold; }
    #player-container { width: 70%; height: 100vh; float: right; background: #000; }
    video { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>📺 Плейлист TV</h2>
    <ul id="playlist"></ul>
  </div>

  <div id="player-container">
    <video id="videoPlayer" controls autoplay preload="metadata"></video>
  </div>

  <script>
    var video = document.getElementById('videoPlayer');
    var playlistEl = document.getElementById('playlist');
    var hls = null;

    function loadPlaylist() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'playlist.json?t=' + new Date().getTime(), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200 || xhr.status === 0) {
            try {
              var data = JSON.parse(xhr.responseText);
              renderPlaylist(data);
            } catch (e) {
              alert('Помилка обробки JSON');
            }
          } else {
            alert('Помилка завантаження плейлиста');
          }
        }
      };
      xhr.send();
    }

    function renderPlaylist(data) {
      playlistEl.innerHTML = '';
      for (var i = 0; i < data.length; i++) {
        (function(item, index) {
          var li = document.createElement('li');
          li.innerHTML = item.title + ' [' + item.type.toUpperCase() + ']';
          li.onclick = function() {
            playVideo(item.url, item.type, li);
          };
          playlistEl.appendChild(li);

          if (index === 0) {
            playVideo(item.url, item.type, li);
          }
        })(data[i], i);
      }
    }

    function playVideo(url, type, element) {
      var items = playlistEl.getElementsByTagName('li');
      for (var j = 0; j < items.length; j++) {
        items[j].className = '';
      }
      if (element) element.className = 'active';

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (type === 'm3u8' && typeof Hls !== 'undefined' && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play();
        });
      } else {
        video.src = url;
        video.play();
      }
    }

    loadPlaylist();
  </script>
</body>
</html>
